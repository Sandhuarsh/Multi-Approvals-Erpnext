[project]
name = "multi_approvals"
authors = [
    { name = "Multi Approvals", email = "admin@example.com" }
]
description = "A configurable, generic multi-level approval engine for any Frappe DocType."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0"
